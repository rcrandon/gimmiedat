org.gradle.jvmargs=-Xmx2560m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.workers.max=2
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# the Kotlin compile daemon can't open its socket on some Windows setups; compiling in-process sidesteps it
kotlin.compiler.execution.strategy=in-process

# Which CPU architectures to package. The Galaxy S22 (and every modern phone)
# is arm64-v8a. Add x86_64 to test on a desktop emulator:
#   gradlew assembleRelease -Pgimmiedat.abis=arm64-v8a,x86_64
gimmiedat.abis=arm64-v8a
